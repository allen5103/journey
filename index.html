<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F0EEE9" />
  <title>一趟旅程</title>
  <style>
    :root { --ink:#162230; --muted:#65706F; --paper:#F0EEE9; --card:#FFFEFA; --line:#D7D3CB; --blue:#27333B; --teal:#2A9D8F; --amber:#B56D20; --danger:#B74A42; --soft-blue:#E6E3DA; --pantone-cloud:#F0EEE9; --radius:18px; }
    * { box-sizing:border-box; }
    body { margin:0; background:#E7ECF2; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif; }
    button,input,select,textarea { font:inherit; }
    button { border:0; cursor:pointer; }
    button:active { transform:scale(.975); }
    .phone { background:var(--paper); margin:0 auto; min-height:100svh; max-width:600px; overflow:hidden; padding-bottom:90px; position:relative; }
    .page { min-height:calc(100svh - 90px); padding:calc(env(safe-area-inset-top) + 20px) 20px 28px; }
    .eyebrow { color:var(--muted); font-size:12px; font-weight:800; letter-spacing:.2px; margin:0 0 7px; }
    h1,h2,h3,p { margin:0; }
    h1 { font-size:32px; letter-spacing:-.8px; line-height:1.15; }
    h2 { font-size:19px; letter-spacing:-.2px; }
    .row { align-items:center; display:flex; gap:10px; }
    .space { justify-content:space-between; }
    .hero-row { align-items:flex-start; display:flex; justify-content:space-between; }
    .round-button { align-items:center; background:var(--blue); border-radius:16px; color:#fff; display:inline-flex; font-size:25px; font-weight:400; height:46px; justify-content:center; width:46px; }
    .icon-button { align-items:center; background:#EEF2F6; border-radius:14px; color:var(--ink); display:inline-flex; font-size:16px; font-weight:800; height:40px; justify-content:center; min-width:40px; padding:0 11px; }
    .icon-button.danger { color:var(--danger); }
    .primary { align-items:center; background:var(--blue); border-radius:15px; color:#fff; display:flex; font-size:16px; font-weight:800; gap:7px; justify-content:center; min-height:54px; padding:12px 16px; width:100%; }
    .secondary { background:#E8F0FA; border-radius:13px; color:var(--blue); font-size:14px; font-weight:800; min-height:44px; padding:10px 14px; }
    .outline { background:transparent; border:1px solid var(--line); border-radius:13px; color:var(--ink); font-size:14px; font-weight:800; min-height:44px; padding:10px 14px; }
    .danger-button { background:#FFF4F2; border:1px solid #F1C8C1; border-radius:13px; color:var(--danger); font-size:14px; font-weight:800; min-height:44px; padding:10px 14px; }
    .section-title { margin:26px 0 12px; }
    .trip-list { display:grid; gap:12px; margin-top:22px; }
    .trip-card { background:var(--card); border:1px solid var(--line); border-radius:22px; box-shadow:0 6px 17px rgba(22,34,48,.04); overflow:hidden; text-align:left; width:100%; }
    .trip-accent { height:7px; }
    .trip-body { padding:16px; }
    .trip-meta { color:var(--muted); font-size:13px; font-weight:700; margin-top:5px; }
    .trip-progress { color:var(--blue); font-size:12px; font-weight:800; margin-top:15px; }
    .empty { align-items:center; display:flex; flex-direction:column; min-height:360px; justify-content:center; padding:30px 18px; text-align:center; }
    .empty-mark { align-items:center; background:#E8F0FA; border-radius:26px; color:var(--blue); display:flex; font-size:28px; height:68px; justify-content:center; margin-bottom:18px; width:68px; }
    .empty p { color:var(--muted); font-size:15px; line-height:1.55; margin-top:8px; max-width:290px; }
    .tabs { backdrop-filter:blur(16px); background:rgba(255,255,255,.94); border-top:1px solid #E1E7ED; bottom:0; display:grid; grid-template-columns:repeat(3,1fr); left:0; padding:9px 10px calc(env(safe-area-inset-bottom) + 8px); position:fixed; right:0; z-index:20; }
    .tabs-wrap { margin:0 auto; max-width:600px; width:100%; display:grid; grid-template-columns:repeat(3,1fr); }
    .tab { background:transparent; color:#7B8997; font-size:12px; font-weight:800; min-height:52px; }
    .tab.active { color:var(--blue); }
    .tab span { display:block; font-size:18px; line-height:23px; }
    .trip-hero { border-radius:25px; color:#fff; margin:10px 0 0; padding:21px; }
    .trip-hero .destination { color:rgba(255,255,255,.78); font-size:14px; font-weight:800; margin-bottom:4px; }
    .trip-hero h1 { font-size:29px; }
    .hero-meta { border-top:1px solid rgba(255,255,255,.24); display:flex; font-size:13px; font-weight:800; justify-content:space-between; margin-top:19px; padding-top:13px; }
    .date-strip { display:flex; gap:9px; margin:0 -20px; overflow-x:auto; padding:0 20px 3px; scrollbar-width:none; }
    .date-strip::-webkit-scrollbar { display:none; }
    .day-chip { background:#fff; border:1px solid var(--line); border-radius:15px; color:var(--ink); min-width:82px; padding:10px 12px; text-align:left; }
    .day-chip small { color:var(--muted); display:block; font-size:10px; font-weight:800; }
    .day-chip strong { display:block; font-size:14px; margin-top:3px; }
    .day-chip.active { border-color:transparent; color:#fff; }
    .day-chip.active small { color:#DDECFB; }
    .schedule-head { align-items:center; display:flex; justify-content:space-between; margin:23px 0 10px; }
    .add-link { background:transparent; color:var(--blue); font-size:14px; font-weight:800; padding:10px 0; }
    .activity-list { display:grid; gap:4px; }
    .activity { background:var(--card); border:1px solid #E5E7EB; border-radius:18px; padding:14px; scroll-margin-top:150px; transition:background .18s,border .18s; }
    .activity.current { background:#ECF9F5; border:1.5px solid var(--teal); }
    .activity.next { background:#FFF7ED; border:1.5px solid #E9A23B; }
    .state-pill { align-items:center; align-self:flex-start; border-radius:999px; display:inline-flex; font-size:11px; font-weight:800; gap:6px; margin-bottom:10px; padding:5px 9px; }
    .state-pill.current { background:#D5F0E9; color:#176B60; }.state-pill.next { background:#FDE7C8; color:#A95300; }
    .dot { border-radius:50%; display:inline-block; height:8px; width:8px; }.dot.current { background:var(--teal); }.dot.next { background:var(--amber); }
    .activity-main { align-items:flex-start; display:flex; gap:10px; }.check { align-items:center; background:#fff; border:1.5px solid #B8C5D2; border-radius:50%; color:#fff; display:flex; flex:0 0 auto; height:24px; justify-content:center; margin-top:2px; width:24px; }.check.done { background:var(--teal); border-color:var(--teal); }
    .photo { background:#EEF2F6; border-radius:10px; height:48px; object-fit:cover; width:48px; }.activity-copy { flex:1; min-width:0; }.activity-title-row { align-items:flex-start; display:flex; gap:8px; justify-content:space-between; }.activity-title { color:var(--ink); font-size:15px; font-weight:800; line-height:20px; }.activity-title.done { color:#8A98A8; text-decoration:line-through; }.category { background:#EFF4FA; border-radius:999px; color:var(--blue); flex:0 0 auto; font-size:10px; font-weight:800; padding:4px 7px; }.activity-place { color:var(--muted); font-size:13px; margin-top:3px; }.activity-notes { color:#8A98A8; font-size:12px; line-height:17px; margin-top:5px; overflow-wrap:anywhere; }.activity-notes a { color:var(--blue); font-weight:800; text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:2px; }.activity-actions { display:flex; flex-direction:column; gap:4px; }.mini { align-items:center; background:transparent; border-radius:10px; color:var(--blue); display:flex; height:30px; justify-content:center; padding:0; width:30px; }.mini.danger { color:var(--danger); }.mini svg,.icon-button svg { fill:none; height:18px; stroke:currentColor; stroke-linecap:round; stroke-linejoin:round; stroke-width:1.9; width:18px; }
    .time-range { align-items:center; background:var(--soft-blue); border-radius:11px; color:var(--blue); display:flex; font-size:14px; font-weight:800; margin-top:12px; min-height:38px; padding:8px 11px; width:100%; }.gap { align-items:center; color:var(--muted); display:flex; font-size:12px; font-weight:800; gap:7px; min-height:34px; padding:0 12px; }.gap:before,.gap:after { background:#D7E0E9; content:""; flex:1; height:1px; }
    .today-card { background:#fff; border:1px solid var(--line); border-radius:21px; margin-top:20px; padding:18px; }.today-card p { color:var(--muted); font-size:14px; line-height:1.5; margin-top:6px; }
    .settings-card { background:#fff; border:1px solid var(--line); border-radius:18px; margin-top:18px; overflow:hidden; }.setting-row { align-items:center; background:#fff; color:var(--ink); display:flex; font-size:15px; font-weight:800; justify-content:space-between; min-height:58px; padding:0 16px; text-align:left; width:100%; }.setting-row + .setting-row { border-top:1px solid #E9EEF2; }.setting-note { color:var(--muted); font-size:13px; line-height:1.55; padding:16px; }
    .modal { align-items:flex-end; background:rgba(14,25,36,.42); bottom:0; display:flex; left:0; opacity:0; padding:0; pointer-events:none; position:fixed; right:0; top:0; transition:opacity .18s; z-index:40; }.modal.open { opacity:1; pointer-events:auto; }.sheet { background:var(--paper); border-radius:26px 26px 0 0; display:flex; max-height:92svh; overflow:hidden; padding:0; transform:translateY(22px); transition:transform .2s; width:100%; }.modal.open .sheet { transform:translateY(0); }.modal-form { display:flex; flex:1; flex-direction:column; min-height:0; }.sheet-scroll { min-height:0; overflow:auto; overscroll-behavior:contain; padding:20px 20px 14px; -webkit-overflow-scrolling:touch; }.sheet h2 { margin-bottom:5px; }.sheet-sub { color:var(--muted); font-size:14px; line-height:1.45; margin-bottom:16px; }.form-grid { display:grid; gap:12px; }.field label { color:#3A4756; display:block; font-size:13px; font-weight:800; margin:4px 0 7px; }.field input,.field select,.field textarea { background:#fff; border:1px solid var(--line); border-radius:14px; color:var(--ink); min-height:50px; padding:12px 13px; width:100%; }.field textarea { min-height:88px; resize:vertical; }.two { display:grid; gap:10px; grid-template-columns:1fr 1fr; }.check-row { align-items:center; color:var(--muted); display:flex; font-size:13px; gap:8px; }.photo-help { color:var(--muted); font-size:12px; line-height:1.5; }.form-actions { background:var(--paper); border-top:1px solid var(--line); display:flex; flex:0 0 auto; gap:10px; margin:0; padding:12px 20px calc(env(safe-area-inset-bottom) + 12px); position:relative; z-index:3; }.form-actions button { flex:1; }.toast { background:#162230; border-radius:12px; bottom:100px; color:#fff; font-size:13px; font-weight:800; left:50%; max-width:calc(100% - 40px); opacity:0; padding:11px 14px; pointer-events:none; position:fixed; text-align:center; transform:translate(-50%,10px); transition:opacity .2s,transform .2s; z-index:60; }.toast.show { opacity:1; transform:translate(-50%,0); }
    @media (min-width:601px) { .phone { box-shadow:0 0 35px rgba(20,35,50,.14); }.tabs { left:50%; max-width:600px; right:auto; transform:translateX(-50%); } }
    @media (prefers-reduced-motion:reduce) { * { scroll-behavior:auto!important; transition:none!important; } }
    .secondary,.empty-mark,.category { background:var(--soft-blue); color:var(--ink); }
    .trip-hero { color:var(--hero-ink,#fff); }
    .trip-hero .destination { color:var(--hero-muted,rgba(255,255,255,.78)); }
    .hero-meta { border-top-color:var(--hero-line,rgba(255,255,255,.24)); }
    .day-chip.active { color:var(--chip-ink,#fff); }
    .day-chip.active small { color:var(--chip-muted,#DDECFB); }
    .native-color-select { height:1px; margin:0; opacity:0; overflow:hidden; padding:0; pointer-events:none; position:absolute; width:1px; }
    .pantone-color-grid { display:grid; gap:8px; grid-template-columns:1fr; margin-top:2px; }
    .pantone-color-choice { background:var(--swatch); border:1px solid rgba(22,34,48,.16); border-radius:12px; color:var(--ink); display:block; font:inherit; min-height:40px; padding:0; position:relative; width:100%; }
    .pantone-color-choice.selected { border-color:var(--ink); box-shadow:0 0 0 2px rgba(22,34,48,.18); }
    .pantone-color-choice.selected::after { color:var(--swatch-check,#fff); content:"✓"; font-size:18px; font-weight:900; left:50%; position:absolute; text-shadow:0 1px 2px rgba(0,0,0,.22); top:50%; transform:translate(-50%,-50%); }
    .pantone-swatch,.pantone-color-copy { display:none; }
    .map-status { color:var(--muted); font-size:12px; line-height:1.45; margin-top:7px; }
    .map-canvas { background:#E8E5DE; border:1px solid var(--line); border-radius:14px; height:190px; margin-top:10px; overflow:hidden; width:100%; }
    .map-canvas.empty { align-items:center; color:var(--muted); display:flex; font-size:12px; justify-content:center; padding:16px; text-align:center; }
    .activity-map { background:#E8E5DE; border-radius:12px; height:160px; margin-top:12px; overflow:hidden; width:100%; }
    .activity-map.empty { align-items:center; color:var(--muted); display:flex; font-size:12px; justify-content:center; padding:14px; text-align:center; }
    .map-open { color:var(--blue); display:inline-block; font-size:12px; font-weight:800; margin:9px 0 1px; text-decoration:underline; text-underline-offset:3px; }
  </style>
</head>
<body>
  <main id="app" class="phone" aria-live="polite"></main>
  <div id="modal" class="modal" aria-hidden="true"><div id="sheet" class="sheet"></div></div>
  <div id="toast" class="toast"></div>
  <input id="import-file" type="file" accept="application/json,.json" hidden />
  <script>
    (() => {
      const STORAGE_KEY = "journey-offline-html-v1";
      const MAPS_BROWSER_KEY = "AIzaSyAgEXiJ7kJ541OekLUBojvLrWyr9MXO94I";
      const MAPS_ENABLED = location.protocol !== "file:" && !MAPS_BROWSER_KEY.startsWith("__GOOGLE_MAPS_");
      let mapsLoader = null;
      const PANTONE_COLORS = [
        { year:2026, name:"Cloud Dancer", code:"11-4201", hex:"#F0EEE9" },
        { year:2021, name:"Illuminating", code:"13-0647", hex:"#F5DF4D" },
        { year:2024, name:"Peach Fuzz", code:"13-1023", hex:"#FFBE98" },
        { year:2017, name:"Greenery", code:"15-0343", hex:"#88B04B" },
        { year:2019, name:"Living Coral", code:"16-1546", hex:"#FF6F61" },
        { year:2025, name:"Mocha Mousse", code:"17-1230", hex:"#A47864" },
        { year:2022, name:"Very Peri", code:"17-3938", hex:"#6667AB" },
        { year:2021, name:"Ultimate Gray", code:"17-5104", hex:"#939597" },
        { year:2023, name:"Viva Magenta", code:"18-1750", hex:"#BB2649" },
        { year:2018, name:"Ultra Violet", code:"18-3838", hex:"#5F4B8B" },
        { year:2020, name:"Classic Blue", code:"19-4052", hex:"#0F4C81" }
      ];
      const COLORS = PANTONE_COLORS.map((color) => color.hex);
      const CATEGORIES = ["景點", "餐飲", "交通", "住宿", "購物", "其他"];
      const state = { trips: loadTrips(), view: "trips", selectedTripId: null, selectedDate: null, focusOnTarget: false, toastTimer: null };
      const $ = (selector) => document.querySelector(selector);
      const esc = (value = "") => String(value).replace(/[&<>'"]/g, (ch) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", "'":"&#39;", '"':"&quot;" }[ch]));
      const localDate = (date = new Date()) => `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2,"0")}-${String(date.getDate()).padStart(2,"0")}`;
      const parseDate = (value) => new Date(`${value}T12:00:00`);
      const newId = (prefix) => `${prefix}-${globalThis.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(36).slice(2)}`}`;
      const min = (value) => { const [h,m] = String(value || "").split(":").map(Number); return Number.isFinite(h) && Number.isFinite(m) ? h * 60 + m : null; };
      const timeRange = (activity) => `${activity.startTime} — ${activity.endTime}`;
      const dateLabel = (value) => new Intl.DateTimeFormat("zh-TW", { month:"long", day:"numeric", weekday:"short" }).format(parseDate(value));
      const shortDate = (value) => new Intl.DateTimeFormat("zh-TW", { month:"numeric", day:"numeric" }).format(parseDate(value));
      const datesBetween = (start, end) => { const days = []; const cursor = parseDate(start); const final = parseDate(end); while (cursor <= final) { days.push(localDate(cursor)); cursor.setDate(cursor.getDate() + 1); } return days; };
      const sortActivities = (items) => [...items].sort((a,b) => `${a.date}|${a.startTime}`.localeCompare(`${b.date}|${b.startTime}`));
      const gapMinutes = (current,next) => Math.max(0, min(next.startTime) - min(current.endTime));
      const gapLabel = (minutes) => minutes >= 60 ? `${Math.floor(minutes / 60)} 小時${minutes % 60 ? ` ${minutes % 60} 分鐘` : ""}` : `${minutes} 分鐘`;
      function loadTrips() { try { const raw = localStorage.getItem(STORAGE_KEY); const data = raw ? JSON.parse(raw) : []; return Array.isArray(data) ? data : []; } catch { return []; } }
      function persist() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.trips)); return true; } catch { toast("無法寫入本機儲存；請先匯出備份。", 4200); return false; } }
      function toast(text, duration = 2400) { const node = $("#toast"); node.textContent = text; node.classList.add("show"); clearTimeout(state.toastTimer); state.toastTimer = setTimeout(() => node.classList.remove("show"), duration); }
      function selectedTrip() { return state.trips.find((trip) => trip.id === state.selectedTripId) || null; }
      function targetFor(trip, now = new Date()) { const today = localDate(now); if (!trip || today < trip.startDate || today > trip.endDate) return null; const currentMinute = now.getHours() * 60 + now.getMinutes(); const todayItems = sortActivities(trip.activities.filter((activity) => activity.date === today)); const ongoing = todayItems.find((item) => min(item.startTime) <= currentMinute && min(item.endTime) >= currentMinute); if (ongoing) return { id: ongoing.id, date: today, kind: "current" }; const next = todayItems.find((item) => min(item.startTime) > currentMinute); return next ? { id:next.id, date:today, kind:"next" } : null; }
      function focusScheduleNow(trip) { const today = localDate(); const dates = trip ? datesBetween(trip.startDate, trip.endDate) : []; const target = targetFor(trip); state.selectedDate = target?.date || (dates.includes(today) ? today : trip?.startDate || null); state.focusOnTarget = Boolean(target); }
      function svgIcon(name) { const paths = { edit:"<path d='M12 20h9'/><path d='M16.5 3.5a2.12 2.12 0 0 1 3 3L8 18l-4 1 1-4Z'/>", trash:"<path d='M3 6h18'/><path d='M8 6V4h8v2'/><path d='M19 6l-1 15H6L5 6'/><path d='M10 11v5'/><path d='M14 11v5'/>" }; return `<svg viewBox='0 0 24 24' aria-hidden='true'>${paths[name] || ""}</svg>`; }
      function linkifyNotes(value = "") { const source = String(value); const matcher = /https?:\/\/[^\s<>]+/gi; let output = ""; let cursor = 0; let match; while ((match = matcher.exec(source))) { const trailing = (match[0].match(/[.,!?;:，。！？；：）】》]+$/) || [""])[0]; const url = trailing ? match[0].slice(0, -trailing.length) : match[0]; output += esc(source.slice(cursor, match.index)); output += `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(url)}</a>${esc(trailing)}`; cursor = match.index + match[0].length; } return output + esc(source.slice(cursor)); }
      function render() { const app = $("#app"); if (state.view === "detail" && !selectedTrip()) state.view = "trips"; app.innerHTML = state.view === "trips" ? renderTrips() : state.view === "today" ? renderToday() : state.view === "settings" ? renderSettings() : renderDetail(); applyTripColorContrast(app); initializeActivityMaps(app); if (state.view !== "detail") app.insertAdjacentHTML("beforeend", nav()); if (state.view === "detail" && state.focusOnTarget) { state.focusOnTarget = false; setTimeout(() => document.querySelector("[data-device-target='true']")?.scrollIntoView({ behavior:"smooth", block:"center" }), 180); } }

      window.deleteTrip = (id) => { const trip = state.trips.find((item) => item.id === id); if (!trip || !confirm(`確定刪除「${trip.name}」及所有行程嗎？`)) return; state.trips = state.trips.filter((item) => item.id !== id); persist(); state.selectedTripId = null; state.view = "trips"; toast("旅程已刪除"); render(); };
      window.openActivityForm = (tripId, activityId = "") => { const trip = state.trips.find((item) => item.id === tripId); const activity = trip?.activities.find((item) => item.id === activityId); if (trip) showModal(activityForm(trip,activity)); };
      window.saveActivity = async (event,tripId,activityId) => { event.preventDefault(); const trip = state.trips.find((item) => item.id === tripId); const existing = trip?.activities.find((item) => item.id === activityId); if (!trip) return; const form = event.currentTarget; const data = Object.fromEntries(new FormData(form)); if (data.date < trip.startDate || data.date > trip.endDate) return toast("行程日期需在旅程期間內。"); if (data.endTime <= data.startTime) return toast("結束時間需晚於開始時間。"); let imageData = existing?.imageData || ""; const photo = form.elements.photo.files[0]; if (photo) { try { imageData = await fileToDataUrl(photo); } catch { return toast("圖片讀取失敗，請改用其他檔案。",3500); } } if (data.removePhoto === "on") imageData = ""; const hasCoordinates = validCoordinates(data.latitude,data.longitude); const next = { id:existing?.id || newId("activity"), date:data.date, startTime:data.startTime, endTime:data.endTime, title:data.title.trim(), place:data.place.trim(), mapSearch:data.mapSearch.trim(), latitude:hasCoordinates ? Number(data.latitude) : null, longitude:hasCoordinates ? Number(data.longitude) : null, placeId:data.placeId.trim(), category:data.category, notes:data.notes.trim(), imageData, completed:existing?.completed || false }; if (existing) Object.assign(existing,next); else trip.activities.push(next); persist(); focusScheduleNow(trip); closeModal(); toast(existing ? "行程已更新" : "行程已加入"); render(); };
      window.toggleActivity = (tripId,activityId) => { const item = state.trips.find((trip) => trip.id === tripId)?.activities.find((activity) => activity.id === activityId); if (item) { item.completed = !item.completed; persist(); render(); } };
      window.deleteActivity = (tripId,activityId) => { if (!confirm("確定移除這個行程嗎？")) return; const trip = state.trips.find((item) => item.id === tripId); if (trip) { trip.activities = trip.activities.filter((item) => item.id !== activityId); persist(); toast("行程已移除"); render(); } };
      window.exportTrip = (id) => { const trip = state.trips.find((item) => item.id === id); if (!trip) return; download(JSON.stringify({ format:"journey-offline/v1", exportedAt:new Date().toISOString(), trips:[trip] },null,2), `journey-${trip.name.replace(/[^\w\u4e00-\u9fff-]+/g,"-") || "backup"}.json`); toast("備份檔已產生"); };
      window.exportAll = () => { download(JSON.stringify({ format:"journey-offline/v1", exportedAt:new Date().toISOString(), trips:state.trips },null,2), "journey-all-backup.json"); toast("全部旅程備份檔已產生"); };
      window.triggerImport = () => $("#import-file").click();
      $("#import-file").addEventListener("change", async (event) => { const file = event.target.files?.[0]; if (!file) return; try { const backup = JSON.parse(await file.text()); const entries = Array.isArray(backup.trips) ? backup.trips : backup.trip ? [backup.trip] : []; if (!entries.length) throw new Error("找不到旅程"); const imported = entries.map(cloneTrip); state.trips.unshift(...imported); persist(); toast(`已匯入 ${imported.length} 趟旅程`); render(); } catch (error) { toast(error instanceof Error ? `匯入失敗：${error.message}` : "匯入失敗，請確認檔案格式。",4200); } finally { event.target.value = ""; } });
      window.clearAll = () => { if (!confirm("確定清除這台裝置上的所有旅程資料嗎？此動作無法復原。")) return; state.trips = []; persist(); toast("本機旅程資料已清除"); render(); };
      window.closeModal = closeModal;
      $("#modal").addEventListener("click", closeModal);
      render();
    })();
  </script>
</body>
</html>
